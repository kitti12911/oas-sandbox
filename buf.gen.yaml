version: v2
inputs:
    - git_repo: https://github.com/kitti12911/proto-sandbox.git
      tag: v1.9.0
      paths:
          - common/v1
          - user/v1/user.proto
          - worker/v1/worker.proto
          - saga/v1/saga.proto
plugins:
    - local: protoc-gen-go
      out: gen/grpc
      opt:
          - paths=source_relative
          - Mcommon/v1/pagination.proto=oas-sandbox/gen/grpc/common/v1
          - Mcommon/v1/query.proto=oas-sandbox/gen/grpc/common/v1
          - Muser/v1/user.proto=oas-sandbox/gen/grpc/user/v1
          - Mworker/v1/worker.proto=oas-sandbox/gen/grpc/worker/v1
          - Msaga/v1/saga.proto=oas-sandbox/gen/grpc/saga/v1
    - local: protoc-gen-go-grpc
      out: gen/grpc
      opt:
          - paths=source_relative
          - Mcommon/v1/pagination.proto=oas-sandbox/gen/grpc/common/v1
          - Mcommon/v1/query.proto=oas-sandbox/gen/grpc/common/v1
          - Muser/v1/user.proto=oas-sandbox/gen/grpc/user/v1
          - Mworker/v1/worker.proto=oas-sandbox/gen/grpc/worker/v1
          - Msaga/v1/saga.proto=oas-sandbox/gen/grpc/saga/v1
