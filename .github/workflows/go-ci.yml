name: Go CI

on:
    push:
        branches:
            - develop
            - uat
            - main
        paths:
            - ".releaserc.json"
            - ".github/workflows/go-ci.yml"
            - ".github/workflows/release.yml"
            - ".golangci.yml"
            - "Dockerfile"
            - "Makefile"
            - "buf.gen.yaml"
            - "config.example.yml"
            - "go.mod"
            - "go.sum"
            - "**/*.go"
            - "**/*.yml"
            - "**/*.yaml"
            - "!README.md"
    pull_request:
        paths:
            - ".releaserc.json"
            - ".github/workflows/go-ci.yml"
            - ".github/workflows/release.yml"
            - ".golangci.yml"
            - "Dockerfile"
            - "Makefile"
            - "buf.gen.yaml"
            - "config.example.yml"
            - "go.mod"
            - "go.sum"
            - "**/*.go"
            - "**/*.yml"
            - "**/*.yaml"
            - "!README.md"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    generate:
        name: Generate
        runs-on: ubuntu-latest
        container:
            image: zot.kittiaccess.work/kitti12911/image-toolchain@sha256:4d4df528102fbc311564d5225c78178ef4069afe0b4bf7e3b90cd8bcf6e38645
            credentials:
                username: ${{ secrets.ZOT_USERNAME }}
                password: ${{ secrets.ZOT_TOKEN }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Generate code
              run: |
                  rm -rf gen/grpc
                  buf generate
                  go run ./cmd/gen-patch

            # actions/upload-artifact v7.0.1
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: generated-code
                  path: |
                      gen/
                      internal/api/users/v1/patch_gen.go

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs:
            - generate
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # actions/download-artifact v8.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: generated-code
                  path: .

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: false

            - name: Go vet
              run: go vet ./...

            # golangci/golangci-lint-action v9.2.0
            - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
              with:
                  version: v2.12.1
                  args: --timeout=5m

    test:
        name: Test
        runs-on: ubuntu-latest
        needs:
            - generate
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # actions/download-artifact v8.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: generated-code
                  path: .

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: false

            - name: Test with race detector and coverage
              run: |
                  go list -f '{{.Dir}}' ./... \
                      | grep -v '/gen/' \
                      | sed "s#^${PWD}#.#" \
                      | xargs go test -race -coverprofile=coverage.out -covermode=atomic

            - name: Remove generated code from coverage
              run: |
                  awk 'NR == 1 || ($1 !~ /\/gen\// && $1 !~ /(_gen|_generated)\.go:/)' coverage.out > coverage.filtered.out
                  mv coverage.filtered.out coverage.out

            - name: Show coverage
              run: |
                  coverage_total="$(go tool cover -func=coverage.out | tail -n 1)"
                  echo "${coverage_total}"
                  {
                      echo "## Go coverage"
                      echo
                      echo '```text'
                      echo "${coverage_total}"
                      echo '```'
                  } >> "${GITHUB_STEP_SUMMARY}"

    openapi:
        name: OpenAPI Change Report
        runs-on: ubuntu-latest
        container:
            image: zot.kittiaccess.work/kitti12911/image-toolchain@sha256:4d4df528102fbc311564d5225c78178ef4069afe0b4bf7e3b90cd8bcf6e38645
            credentials:
                username: ${{ secrets.ZOT_USERNAME }}
                password: ${{ secrets.ZOT_TOKEN }}
        env:
            BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
            REPORT_MODE: ${{ github.event_name == 'pull_request' && 'breaking' || 'main' }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            - name: Trust workspace checkout
              run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

            - name: Install OpenAPI comparison tools
              run: go install github.com/oasdiff/oasdiff@v1.14.0

            - name: Generate revision OpenAPI
              run: |
                  rm -rf gen/grpc
                  if grep -q '^inputs:' buf.gen.yaml; then
                      buf generate
                  else
                      buf generate https://github.com/kitti12911/proto-sandbox.git --path common/v1 --path user/v1
                  fi
                  go run ./cmd/gen-patch
                  make gen-openapi > "${RUNNER_TEMP}/openapi-revision.yaml"

            - name: Generate base OpenAPI
              run: |
                  git checkout "${BASE_SHA}"
                  rm -rf gen/grpc
                  if grep -q '^inputs:' buf.gen.yaml; then
                      buf generate
                  else
                      buf generate https://github.com/kitti12911/proto-sandbox.git --path common/v1 --path user/v1
                  fi
                  go run ./cmd/gen-patch
                  make gen-openapi > "${RUNNER_TEMP}/openapi-base.yaml"

            - name: Restore revision checkout
              run: git checkout "${GITHUB_SHA}"

            - name: Compare OpenAPI
              env:
                  ALLOW_BREAKING_MESSAGE: "[allow-breaking-api]"
              run: |
                  allow_breaking=false
                  if [ "${GITHUB_EVENT_NAME}" = "push" ] &&
                     git log -1 --pretty=%B | grep -Fq "${ALLOW_BREAKING_MESSAGE}"; then
                      allow_breaking=true
                  fi

                  set +e
                  oasdiff breaking --format json --fail-on ERR \
                      "${RUNNER_TEMP}/openapi-base.yaml" \
                      "${RUNNER_TEMP}/openapi-revision.yaml" \
                      > "${RUNNER_TEMP}/openapi-breaking.json" \
                      2> "${RUNNER_TEMP}/openapi-breaking.err"
                  breaking_status="$?"
                  set -e

                  {
                      echo "## OpenAPI changes"
                      echo
                      echo "Compared base \`${BASE_SHA}\` to revision \`${GITHUB_SHA}\`."
                      echo
                      echo "Report mode: \`${REPORT_MODE}\`."
                      echo
                      go run ./cmd/openapi-report \
                          -base "${RUNNER_TEMP}/openapi-base.yaml" \
                          -revision "${RUNNER_TEMP}/openapi-revision.yaml" \
                          -breaking "${RUNNER_TEMP}/openapi-breaking.json" \
                          -mode "${REPORT_MODE}"
                  } >> "${GITHUB_STEP_SUMMARY}"

                  breaking_json="$(tr -d '[:space:]' < "${RUNNER_TEMP}/openapi-breaking.json")"
                  breaking_detected=false
                  if [ "${breaking_json}" != "" ] && [ "${breaking_json}" != "[]" ] && [ "${breaking_json}" != "{\"changes\":[]}" ]; then
                      breaking_detected=true
                  fi

                  if [ "${breaking_detected}" = "true" ] && [ "${allow_breaking}" = "true" ]; then
                      {
                          echo
                          echo "> Breaking changes were detected, but release is allowed because \`${ALLOW_BREAKING_MESSAGE}\` is present in the head commit message."
                      } >> "${GITHUB_STEP_SUMMARY}"
                      exit 0
                  fi

                  if [ "${breaking_detected}" = "true" ]; then
                      echo "OpenAPI breaking changes detected."
                      cat "${RUNNER_TEMP}/openapi-breaking.err"
                      exit 1
                  fi

                  if [ "${breaking_status}" -ne 0 ]; then
                      cat "${RUNNER_TEMP}/openapi-breaking.err"
                      exit "${breaking_status}"
                  fi

    toolchain-security:
        name: Toolchain Security
        runs-on: ubuntu-latest
        needs:
            - generate
        container:
            image: zot.kittiaccess.work/kitti12911/security-toolchain@sha256:216b1bfb7a3d0955a4c1a7ffb5ab2b3203d8fd538f1b8e181668e1dd88135571
            credentials:
                username: ${{ secrets.ZOT_USERNAME }}
                password: ${{ secrets.ZOT_TOKEN }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            # actions/download-artifact v8.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: generated-code
                  path: .

            - name: govulncheck
              run: govulncheck ./...

            - name: Semgrep
              run: semgrep scan --config=p/golang --config=p/secrets --error

    security:
        name: Security
        runs-on: ubuntu-latest
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            # aquasecurity/trivy-action v0.36.0
            - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,misconfig
                  exit-code: 1
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true

            # gitleaks/gitleaks-action v2.3.9
            - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release:
        name: Release
        needs:
            - generate
            - lint
            - openapi
            - test
            - toolchain-security
            - security
        if: |
            always() &&
            github.event_name == 'push' &&
            needs.lint.result == 'success' &&
            needs.test.result == 'success' &&
            needs.toolchain-security.result == 'success' &&
            needs.security.result == 'success' &&
            (needs.openapi.result == 'success' || needs.openapi.result == 'skipped')
        permissions:
            contents: write
            issues: write
            pull-requests: write
        uses: ./.github/workflows/release.yml
        with:
            release_branch: ${{ github.ref_name }}
            release_sha: ${{ github.sha }}
        secrets: inherit

    promotion-pr:
        name: Create Promotion PR
        runs-on: ubuntu-latest
        needs:
            - release
        if: |
            github.event_name == 'push' &&
            (github.ref_name == 'develop' || github.ref_name == 'uat')
        permissions:
            contents: read
            issues: write
            pull-requests: write
        steps:
            - name: Create or update promotion PR
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_BRANCH: ${{ github.ref_name }}
                  SOURCE_SHA: ${{ github.sha }}
                  WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  case "${SOURCE_BRANCH}" in
                      develop)
                          TARGET_BRANCH="uat"
                          ;;
                      uat)
                          TARGET_BRANCH="main"
                          ;;
                      *)
                          echo "No promotion target configured for ${SOURCE_BRANCH}."
                          exit 0
                          ;;
                  esac

                  compare_status="$(gh api \
                      "repos/${REPOSITORY}/compare/${TARGET_BRANCH}...${SOURCE_BRANCH}" \
                      --jq '.status')"
                  if [ "${compare_status}" = "identical" ] || [ "${compare_status}" = "behind" ]; then
                      echo "${SOURCE_BRANCH} has no new commits to promote to ${TARGET_BRANCH}."
                      exit 0
                  fi

                  title="Promote ${SOURCE_BRANCH} to ${TARGET_BRANCH}"
                  body="$(mktemp)"
                  cat > "${body}" <<EOF
                  Automated promotion PR from \`${SOURCE_BRANCH}\` to \`${TARGET_BRANCH}\`.

                  Source commit: \`${SOURCE_SHA}\`
                  Successful workflow run: ${WORKFLOW_RUN_URL}
                  EOF

                  existing_prs="$(gh pr list \
                      --repo "${REPOSITORY}" \
                      --head "${SOURCE_BRANCH}" \
                      --base "${TARGET_BRANCH}" \
                      --state open \
                      --json number,createdAt \
                      --jq 'sort_by(.createdAt) | reverse | .[].number')"

                  existing_pr="$(printf '%s\n' "${existing_prs}" | sed -n '1p')"
                  duplicate_prs="$(printf '%s\n' "${existing_prs}" | sed -n '2,$p')"

                  if [ -n "${existing_pr}" ]; then
                      gh pr edit "${existing_pr}" \
                          --repo "${REPOSITORY}" \
                          --title "${title}" \
                          --body-file "${body}"
                      echo "Updated promotion PR #${existing_pr}."
                  else
                      created_pr_url="$(gh pr create \
                          --repo "${REPOSITORY}" \
                          --head "${SOURCE_BRANCH}" \
                          --base "${TARGET_BRANCH}" \
                          --title "${title}" \
                          --body-file "${body}")"
                      existing_pr="$(gh pr view "${created_pr_url}" \
                          --repo "${REPOSITORY}" \
                          --json number \
                          --jq '.number')"
                      echo "Created promotion PR #${existing_pr}."
                  fi

                  for duplicate_pr in ${duplicate_prs}; do
                      gh pr close "${duplicate_pr}" \
                          --repo "${REPOSITORY}" \
                          --comment "Closing duplicate promotion PR; #${existing_pr} now tracks \`${SOURCE_BRANCH}\` to \`${TARGET_BRANCH}\`."
                  done

    helm-image-update:
        name: Update Helm Image Tag
        runs-on: ubuntu-latest
        needs:
            - release
        if: |
            github.event_name == 'push' &&
            needs.release.outputs.published == 'true'
        steps:
            - name: Print pending Helm image update
              env:
                  IMAGE_REF: zot.kittiaccess.work/${{ github.repository }}
                  RELEASE_BRANCH: ${{ github.ref_name }}
                  RELEASE_SHA: ${{ github.sha }}
                  RELEASE_TAG: ${{ needs.release.outputs.git_tag }}
                  IMAGE_DIGEST: ${{ needs.release.outputs.image_digest }}
                  ARM64_DIGEST: ${{ needs.release.outputs.arm64_digest }}
              run: |
                  case "${RELEASE_BRANCH}" in
                      develop)
                          ENVIRONMENT="develop"
                          ;;
                      uat)
                          ENVIRONMENT="uat"
                          ;;
                      main)
                          ENVIRONMENT="production"
                          ;;
                      *)
                          echo "No Helm image update target configured for ${RELEASE_BRANCH}."
                          exit 0
                          ;;
                  esac

                  echo "Helm image update is not implemented yet."
                  echo "Would update ${ENVIRONMENT} values to:"
                  echo "  image.repository=${IMAGE_REF}"
                  echo "  image.tag=${RELEASE_TAG}"
                  echo "  image.shaTag=${RELEASE_SHA}"
                  echo "  image.digest=${IMAGE_DIGEST}"
                  echo "  image.arm64Digest=${ARM64_DIGEST}"

    sync-down:
        name: Sync Main To Prerelease Branches
        runs-on: ubuntu-latest
        needs:
            - release
        if: |
            github.event_name == 'push' &&
            github.ref_name == 'main'
        permissions:
            contents: read
        steps:
            # actions/create-github-app-token v2.1.4
            - uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
              id: branch-sync-token
              with:
                  app-id: ${{ secrets.BRANCH_SYNC_APP_ID }}
                  private-key: ${{ secrets.BRANCH_SYNC_APP_PRIVATE_KEY }}

            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  token: ${{ steps.branch-sync-token.outputs.token }}

            - name: Fast-forward prerelease branches
              env:
                  REPOSITORY: ${{ github.repository }}
                  BRANCH_SYNC_TOKEN: ${{ steps.branch-sync-token.outputs.token }}
              run: |
                  git config user.name "homelab-branch-sync[bot]"
                  git config user.email "homelab-branch-sync[bot]@users.noreply.github.com"
                  git remote set-url origin "https://x-access-token:${BRANCH_SYNC_TOKEN}@github.com/${REPOSITORY}.git"

                  git fetch origin main uat develop

                  git checkout -B uat origin/uat
                  git merge --ff-only origin/main
                  git push origin uat

                  git checkout -B develop origin/develop
                  git merge --ff-only uat
                  git push origin develop
