name: Go CI

on:
    push:
        branches:
            - develop
            - sit
            - uat
            - main
        paths:
            - ".releaserc.json"
            - ".github/workflows/go-ci.yml"
            - ".github/workflows/release.yml"
            - ".golangci.yml"
            - "Dockerfile"
            - "Makefile"
            - "buf.gen.yaml"
            - "config.example.yml"
            - "go.mod"
            - "go.sum"
            - "**/*.go"
            - "**/*.yml"
            - "**/*.yaml"
    pull_request:
        paths:
            - ".releaserc.json"
            - ".github/workflows/go-ci.yml"
            - ".github/workflows/release.yml"
            - ".golangci.yml"
            - "Dockerfile"
            - "Makefile"
            - "buf.gen.yaml"
            - "config.example.yml"
            - "go.mod"
            - "go.sum"
            - "**/*.go"
            - "**/*.yml"
            - "**/*.yaml"

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Install generation tools
              run: |
                  go install github.com/bufbuild/buf/cmd/buf@v1.69.0
                  go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
                  go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

            - name: Generate code
              run: make gen

            - name: Go vet
              run: go vet ./...

            # golangci/golangci-lint-action v9.2.0
            - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
              with:
                  version: v2.12.1
                  args: --timeout=5m

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Install generation tools
              run: |
                  go install github.com/bufbuild/buf/cmd/buf@v1.69.0
                  go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
                  go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

            - name: Generate code
              run: make gen

            - name: Test with race detector and coverage
              run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

            - name: Show coverage
              run: |
                  coverage_total="$(go tool cover -func=coverage.out | tail -n 1)"
                  echo "${coverage_total}"
                  {
                      echo "## Go coverage"
                      echo
                      echo '```text'
                      echo "${coverage_total}"
                      echo '```'
                  } >> "${GITHUB_STEP_SUMMARY}"

    openapi:
        name: OpenAPI Change Report
        runs-on: ubuntu-latest
        env:
            BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
            REPORT_MODE: ${{ github.event_name == 'pull_request' && 'breaking' || 'main' }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Install OpenAPI comparison tools
              run: |
                  go install github.com/bufbuild/buf/cmd/buf@v1.69.0
                  go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
                  go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
                  go install github.com/oasdiff/oasdiff@v1.14.0

            - name: Generate revision OpenAPI
              run: |
                  make gen
                  make gen-openapi > "${RUNNER_TEMP}/openapi-revision.yaml"

            - name: Generate base OpenAPI
              run: |
                  git checkout "${BASE_SHA}"
                  make gen
                  make gen-openapi > "${RUNNER_TEMP}/openapi-base.yaml"

            - name: Restore revision checkout
              run: git checkout "${GITHUB_SHA}"

            - name: Compare OpenAPI
              run: |
                  set +e
                  oasdiff breaking --format json --fail-on ERR \
                      "${RUNNER_TEMP}/openapi-base.yaml" \
                      "${RUNNER_TEMP}/openapi-revision.yaml" \
                      > "${RUNNER_TEMP}/openapi-breaking.json" \
                      2> "${RUNNER_TEMP}/openapi-breaking.err"
                  breaking_status="$?"
                  set -e

                  {
                      echo "## OpenAPI changes"
                      echo
                      echo "Compared base \`${BASE_SHA}\` to revision \`${GITHUB_SHA}\`."
                      echo
                      echo "Report mode: \`${REPORT_MODE}\`."
                      echo
                      go run ./cmd/openapi-report \
                          -base "${RUNNER_TEMP}/openapi-base.yaml" \
                          -revision "${RUNNER_TEMP}/openapi-revision.yaml" \
                          -breaking "${RUNNER_TEMP}/openapi-breaking.json" \
                          -mode "${REPORT_MODE}"
                  } >> "${GITHUB_STEP_SUMMARY}"

                  breaking_json="$(tr -d '[:space:]' < "${RUNNER_TEMP}/openapi-breaking.json")"
                  if [ "${breaking_json}" != "" ] && [ "${breaking_json}" != "[]" ] && [ "${breaking_json}" != "{\"changes\":[]}" ]; then
                      echo "OpenAPI breaking changes detected."
                      cat "${RUNNER_TEMP}/openapi-breaking.err"
                      exit 1
                  fi

                  if [ "${breaking_status}" -ne 0 ]; then
                      cat "${RUNNER_TEMP}/openapi-breaking.err"
                      exit "${breaking_status}"
                  fi

    security:
        name: Security
        runs-on: ubuntu-latest
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Install generation tools
              run: |
                  go install github.com/bufbuild/buf/cmd/buf@v1.69.0
                  go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
                  go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

            - name: Generate code
              run: make gen

            - name: govulncheck
              run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

            # aquasecurity/trivy-action v0.36.0
            - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,misconfig
                  exit-code: 1
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true

            # gitleaks/gitleaks-action v2.3.9
            - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Semgrep
              run: |
                  python3 -m pip install --user semgrep==1.161.0
                  ~/.local/bin/semgrep scan --config=p/golang --config=p/secrets --error

    release:
        name: Release
        needs:
            - lint
            - openapi
            - test
            - security
        if: |
            always() &&
            github.event_name == 'push' &&
            needs.lint.result == 'success' &&
            needs.test.result == 'success' &&
            needs.security.result == 'success' &&
            (needs.openapi.result == 'success' || needs.openapi.result == 'skipped')
        permissions:
            contents: write
            issues: write
            pull-requests: write
        uses: ./.github/workflows/release.yml
        with:
            release_branch: ${{ github.ref_name }}
            release_sha: ${{ github.sha }}
        secrets: inherit
