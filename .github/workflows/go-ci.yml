name: Go CI

on:
    push:
        branches:
            - develop
            - sit
            - uat
            - main
        paths:
            - ".releaserc.json"
            - ".github/workflows/go-ci.yml"
            - ".github/workflows/release.yml"
            - ".golangci.yml"
            - "Dockerfile"
            - "Makefile"
            - "buf.gen.yaml"
            - "config.example.yml"
            - "go.mod"
            - "go.sum"
            - "**/*.go"
            - "**/*.yml"
            - "**/*.yaml"
    pull_request:
        paths:
            - ".releaserc.json"
            - ".github/workflows/go-ci.yml"
            - ".github/workflows/release.yml"
            - ".golangci.yml"
            - "Dockerfile"
            - "Makefile"
            - "buf.gen.yaml"
            - "config.example.yml"
            - "go.mod"
            - "go.sum"
            - "**/*.go"
            - "**/*.yml"
            - "**/*.yaml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    generate:
        name: Generate
        runs-on: ubuntu-latest
        container:
            image: zot.kittiaccess.work/kitti12911/image-toolchain@sha256:ac879786afde1d764a964a3eca163cd7801134eebf656f627d8048c70933693f
            credentials:
                username: ${{ secrets.ZOT_USERNAME }}
                password: ${{ secrets.ZOT_TOKEN }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Generate code
              run: |
                  rm -rf gen/grpc
                  buf generate
                  go run ./cmd/gen-patch

            # actions/upload-artifact v7.0.1
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: generated-code
                  path: |
                      gen/
                      internal/api/users/v1/patch_gen.go

    go-cache:
        name: Go Cache
        runs-on: ubuntu-latest
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Download Go modules
              run: go mod download

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs:
            - generate
            - go-cache
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # actions/download-artifact v8.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: generated-code
                  path: .

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Go vet
              run: go vet ./...

            # golangci/golangci-lint-action v9.2.0
            - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
              with:
                  version: v2.12.1
                  args: --timeout=5m

    test:
        name: Test
        runs-on: ubuntu-latest
        needs:
            - generate
            - go-cache
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # actions/download-artifact v8.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: generated-code
                  path: .

            # actions/setup-go v6.4.0
            - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: go.sum

            - name: Test with race detector and coverage
              run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

            - name: Show coverage
              run: |
                  coverage_total="$(go tool cover -func=coverage.out | tail -n 1)"
                  echo "${coverage_total}"
                  {
                      echo "## Go coverage"
                      echo
                      echo '```text'
                      echo "${coverage_total}"
                      echo '```'
                  } >> "${GITHUB_STEP_SUMMARY}"

    openapi:
        name: OpenAPI Change Report
        runs-on: ubuntu-latest
        container:
            image: zot.kittiaccess.work/kitti12911/image-toolchain@sha256:ac879786afde1d764a964a3eca163cd7801134eebf656f627d8048c70933693f
            credentials:
                username: ${{ secrets.ZOT_USERNAME }}
                password: ${{ secrets.ZOT_TOKEN }}
        env:
            BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
            REPORT_MODE: ${{ github.event_name == 'pull_request' && 'breaking' || 'main' }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            - name: Install OpenAPI comparison tools
              run: go install github.com/oasdiff/oasdiff@v1.14.0

            - name: Generate revision OpenAPI
              run: |
                  rm -rf gen/grpc
                  if grep -q '^inputs:' buf.gen.yaml; then
                      buf generate
                  else
                      buf generate https://github.com/kitti12911/proto-sandbox.git --path common/v1 --path user/v1
                  fi
                  go run ./cmd/gen-patch
                  make gen-openapi > "${RUNNER_TEMP}/openapi-revision.yaml"

            - name: Generate base OpenAPI
              run: |
                  git checkout "${BASE_SHA}"
                  rm -rf gen/grpc
                  if grep -q '^inputs:' buf.gen.yaml; then
                      buf generate
                  else
                      buf generate https://github.com/kitti12911/proto-sandbox.git --path common/v1 --path user/v1
                  fi
                  go run ./cmd/gen-patch
                  make gen-openapi > "${RUNNER_TEMP}/openapi-base.yaml"

            - name: Restore revision checkout
              run: git checkout "${GITHUB_SHA}"

            - name: Compare OpenAPI
              run: |
                  set +e
                  oasdiff breaking --format json --fail-on ERR \
                      "${RUNNER_TEMP}/openapi-base.yaml" \
                      "${RUNNER_TEMP}/openapi-revision.yaml" \
                      > "${RUNNER_TEMP}/openapi-breaking.json" \
                      2> "${RUNNER_TEMP}/openapi-breaking.err"
                  breaking_status="$?"
                  set -e

                  {
                      echo "## OpenAPI changes"
                      echo
                      echo "Compared base \`${BASE_SHA}\` to revision \`${GITHUB_SHA}\`."
                      echo
                      echo "Report mode: \`${REPORT_MODE}\`."
                      echo
                      go run ./cmd/openapi-report \
                          -base "${RUNNER_TEMP}/openapi-base.yaml" \
                          -revision "${RUNNER_TEMP}/openapi-revision.yaml" \
                          -breaking "${RUNNER_TEMP}/openapi-breaking.json" \
                          -mode "${REPORT_MODE}"
                  } >> "${GITHUB_STEP_SUMMARY}"

                  breaking_json="$(tr -d '[:space:]' < "${RUNNER_TEMP}/openapi-breaking.json")"
                  if [ "${breaking_json}" != "" ] && [ "${breaking_json}" != "[]" ] && [ "${breaking_json}" != "{\"changes\":[]}" ]; then
                      echo "OpenAPI breaking changes detected."
                      cat "${RUNNER_TEMP}/openapi-breaking.err"
                      exit 1
                  fi

                  if [ "${breaking_status}" -ne 0 ]; then
                      cat "${RUNNER_TEMP}/openapi-breaking.err"
                      exit "${breaking_status}"
                  fi

    toolchain-security:
        name: Toolchain Security
        runs-on: ubuntu-latest
        needs:
            - generate
        container:
            image: zot.kittiaccess.work/kitti12911/security-toolchain@sha256:c5e93aedae93ba4819de5aa0b1636619f9ac7777652dcc5781c043e8ed7c74b7
            credentials:
                username: ${{ secrets.ZOT_USERNAME }}
                password: ${{ secrets.ZOT_TOKEN }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            # actions/download-artifact v8.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: generated-code
                  path: .

            - name: govulncheck
              run: govulncheck ./...

            - name: Semgrep
              run: semgrep scan --config=p/golang --config=p/secrets --error

    security:
        name: Security
        runs-on: ubuntu-latest
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            # aquasecurity/trivy-action v0.36.0
            - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,misconfig
                  exit-code: 1
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true

            # gitleaks/gitleaks-action v2.3.9
            - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release:
        name: Release
        needs:
            - generate
            - lint
            - openapi
            - test
            - toolchain-security
            - security
        if: |
            always() &&
            github.event_name == 'push' &&
            needs.lint.result == 'success' &&
            needs.test.result == 'success' &&
            needs.toolchain-security.result == 'success' &&
            needs.security.result == 'success' &&
            (needs.openapi.result == 'success' || needs.openapi.result == 'skipped')
        permissions:
            contents: write
            issues: write
            pull-requests: write
        uses: ./.github/workflows/release.yml
        with:
            release_branch: ${{ github.ref_name }}
            release_sha: ${{ github.sha }}
        secrets: inherit
